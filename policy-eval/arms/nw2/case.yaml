schema_version: "1.1"
name: nw2
runs: 1
execution:
  model: claude-sonnet-5-5
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [WebSearch, WebFetch, Agent, Skill, Bash, Read, Write]
  prompt: |
    Research this question with scored web search, mode news, field news, and write a short sourced report: What happened in the most recent major cloud provider outage and what was the root cause?
graders:
  - name: keep-trace
    type: regex
    target: trace
    pattern: "[\\s\\S]*"
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
