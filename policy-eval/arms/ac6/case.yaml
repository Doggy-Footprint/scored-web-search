schema_version: "1.1"
name: ac6
runs: 1
execution:
  model: claude-opus-5-5
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [WebSearch, WebFetch, Agent, Skill, Bash, Read, Write]
  prompt: |
    Research this question with scored web search, mode academic, field ai, and write a short sourced report: Why does fine-tuning a model on a new task make it worse at tasks it already handled?
graders:
  - name: keep-trace
    type: regex
    target: trace
    pattern: "[\\s\\S]*"
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
