schema_version: "1.1"
name: na6
runs: 1
execution:
  model: claude-sonnet-5-5
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [WebSearch, WebFetch, Agent, Skill, Bash, Read, Write]
  prompt: |
    Research this question with scored web search, mode non-academic, field cs, and write a short sourced report: How do teams keep one slow downstream service from taking down the rest of the system?
graders:
  - name: keep-trace
    type: regex
    target: trace
    pattern: "[\\s\\S]*"
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
