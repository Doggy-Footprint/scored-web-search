schema_version: "1.1"
name: od2
runs: 1
execution:
  model: claude-opus-5-5
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [WebSearch, WebFetch, Agent, Skill, Bash, Read, Write]
  prompt: |
    Research this question with scored web search, mode official-docs, field ai, and write a short sourced report: What are the rate limits and retry semantics of the Anthropic Messages API?
graders:
  - name: keep-trace
    type: regex
    target: trace
    pattern: "[\\s\\S]*"
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
