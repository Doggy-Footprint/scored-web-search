schema_version: "1.1"
name: od3
runs: 1
execution:
  model: claude-sonnet-5-5
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [WebSearch, WebFetch, Agent, Skill, Bash, Read, Write]
  prompt: |
    Research this question with scored web search, mode official-docs, field cs, and write a short sourced report: How is authentication configured in the current version of Next.js App Router?
graders:
  - name: keep-trace
    type: regex
    target: trace
    pattern: "[\\s\\S]*"
  - name: skill-fired
    type: tool_used
    tool: Skill
    arm: with-only
