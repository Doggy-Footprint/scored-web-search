name: skill-zip

on:
  push:
    branches: [master]
    paths: ['skills/scored-web-search/**', '.claude-plugin/plugin.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m unittest discover tests
      - run: python3 scripts/check_policy.py
      - run: scripts/build_skill_zip.sh dist/scored-web-search.zip
      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish_release.sh dist/scored-web-search.zip "${GITHUB_SHA}"
